<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziesmu grāmata — Cast tests</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#202124}label{display:block;font-weight:bold;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:10px;font:inherit}textarea{min-height:220px}button{padding:12px 16px;margin:8px 8px 8px 0;font-size:1rem}#status{padding:12px;background:#f1f3f4;border-radius:8px;white-space:pre-wrap}.note{color:#555}</style><script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script></head><body><h1>Google Cast — kopdziedāšanas tests</h1><p class="note">Atsevišķa testa lapa. Televizora pārbaudei vajadzīgs Google Cast Developer Console piešķirts Application ID.</p><label for="appId">Application ID</label><input id="appId" placeholder="Ievadi Google piešķirto ID"><label for="songTitle">Dziesmas nosaukums</label><input id="songTitle" value="Pārbaudes dziesma"><label for="songLyrics">Dziesmas vārdi</label><textarea id="songLyrics">Pirmajā rindā — dziesmas vārdi\nOtrajā rindā — dziesmas vārdi\nTrešajā rindā — dziesmas vārdi</textarea><button id="connect">1. Savienot ar TV</button><button id="send" disabled>2. Rādīt dziesmu TV</button><button id="clear" disabled>Notīrīt TV tekstu</button><div id="status">Statuss: gaida Cast API ielādi.</div><script>(()=>{const NS="urn:x-cast:lv.dziesmugramata.lyrics",s=document.getElementById("status"),b=document.getElementById("connect"),send=document.getElementById("send"),clear=document.getElementById("clear");let ready=false;window.__onGCastApiAvailable=a=>{ready=!!a;s.textContent=a?"Cast API ielādēts. Ievadi Application ID un savieno ar TV.":"Cast API nav pieejams. Izmanto Google Chrome un HTTPS adresi."};b.onclick=async()=>{const id=document.getElementById("appId").value.trim();if(!ready){s.textContent="Cast API vēl nav gatavs vai nav pieejams.";return}if(!id){s.textContent="Vispirms ievadi Application ID.";return}try{const c=cast.framework.CastContext.getInstance();c.setOptions({receiverApplicationId:id,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});await c.requestSession();if(!c.getCurrentSession())throw Error("Cast sesija netika izveidota");send.disabled=false;clear.disabled=false;s.textContent="Savienojums izveidots. Tagad nospied “Rādīt dziesmu TV”."}catch(e){s.textContent="Savienojums neizdevās: "+(e.message||e)}};send.onclick=async()=>{const x=cast.framework.CastContext.getInstance().getCurrentSession();if(!x)return;try{await x.sendMessage(NS,{title:document.getElementById("songTitle").value,lyrics:document.getElementById("songLyrics").value});s.textContent="Dziesmas teksts nosūtīts televizoram."}catch(e){s.textContent="Tekstu neizdevās nosūtīt: "+(e.message||e)}};clear.onclick=async()=>{const x=cast.framework.CastContext.getInstance().getCurrentSession();if(x)try{await x.sendMessage(NS,{title:"Mana dziesmu grāmata",lyrics:"Gaidām dziesmu no telefona…"});s.textContent="Televizora teksts notīrīts."}catch(e){s.textContent="Neizdevās notīrīt tekstu: "+(e.message||e)}}})();</script></body></html>
