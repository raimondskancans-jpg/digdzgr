<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziesmu grāmata — tālruņa tests</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#202124}label{display:block;font-weight:bold;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:10px;font:inherit}textarea{min-height:220px}button{padding:12px 16px;margin:8px 8px 8px 0;font-size:1rem}#status{padding:12px;background:#f1f3f4;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.note{color:#555}</style></head><body>
<h1>Dziesmu grāmata — tālruņa tests</h1><p class="note">Bezmaksas Firebase testa variants. Ievadi Firebase tīmekļa lietotnes konfigurāciju. Telpas kodu nosūti tikai savai TV lapai.</p>
<label>Firebase apiKey</label><input id="apiKey"><label>Firebase authDomain</label><input id="authDomain" placeholder="projekta-id.firebaseapp.com"><label>Firebase databaseURL</label><input id="databaseURL" placeholder="Firebase Console redzamais datubāzes URL"><label>Firebase projectId</label><input id="projectId"><label>Firebase appId</label><input id="appId">
<hr><label>TV telpas kods</label><input id="roomId" readonly placeholder="Nospied “Izveidot TV telpu”"><button id="create">1. Izveidot TV telpu</button>
<label>Dziesmas nosaukums</label><input id="songTitle" value="Pārbaudes dziesma"><label>Dziesmas vārdi</label><textarea id="songLyrics">Pirmajā rindā — dziesmas vārdi
Otrajā rindā — dziesmas vārdi
Trešajā rindā — dziesmas vārdi</textarea>
<button id="send" disabled>2. Rādīt dziesmu TV</button><button id="clear" disabled>Notīrīt TV tekstu</button><div id="status">Statuss: ievadi Firebase konfigurāciju.</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getDatabase, ref, push, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const $=id=>document.getElementById(id), status=m=>$("status").textContent=m; let db,uid,roomKey;
function config(){const c={apiKey:$("apiKey").value.trim(),authDomain:$("authDomain").value.trim(),databaseURL:$("databaseURL").value.trim(),projectId:$("projectId").value.trim(),appId:$("appId").value.trim()};if(Object.values(c).some(v=>!v))throw Error("Aizpildi visus piecus Firebase konfigurācijas laukus.");return c}
async function init(){if(db)return;const app=initializeApp(config());const a=await signInAnonymously(getAuth(app));uid=a.user.uid;db=getDatabase(app)}
$("create").onclick=async()=>{try{status("Savienojas ar Firebase…");await init();const r=push(ref(db,"rooms"));roomKey=r.key;await set(r,{hostUid:uid,title:$("songTitle").value.trim()||"Dziesmu grāmata",lyrics:$("songLyrics").value,updatedAt:serverTimestamp()});$("roomId").value=roomKey;$("send").disabled=false;$("clear").disabled=false;status("TV telpa izveidota.\nTelpas kods: "+roomKey+"\nIevadi šo kodu TV lapā.");}catch(e){status("Kļūda: "+(e.message||e))}};
$("send").onclick=async()=>{try{await update(ref(db,"rooms/"+roomKey),{title:$("songTitle").value.trim()||"Dziesmu grāmata",lyrics:$("songLyrics").value,updatedAt:serverTimestamp()});status("Dziesmas teksts nosūtīts TV telpai.")}catch(e){status("Neizdevās nosūtīt: "+(e.message||e))}};
$("clear").onclick=async()=>{try{await update(ref(db,"rooms/"+roomKey),{title:"Mana dziesmu grāmata",lyrics:"Gaidām dziesmu no telefona…",updatedAt:serverTimestamp()});status("TV teksts nomainīts uz sākuma paziņojumu.")}catch(e){status("Neizdevās notīrīt: "+(e.message||e))}};
</script></body></html>
