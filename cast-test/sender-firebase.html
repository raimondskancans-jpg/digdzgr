<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziesmu grāmata — telefons</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:20px auto;padding:0 16px;color:#202124}label{display:block;font-weight:bold;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit}textarea{min-height:220px}button{padding:12px 16px;margin:12px 8px 8px 0;font-size:1rem}#status{padding:12px;background:#f1f3f4;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Nosūtīt dziesmu uz TV</h1><label>TV telpas kods</label><input id="room" readonly><label>Dziesmas nosaukums</label><input id="title" value="Pārbaudes dziesma"><label>Dziesmas vārdi</label><textarea id="lyrics">Pirmajā rindā — dziesmas vārdi
Otrajā rindā — dziesmas vārdi
Trešajā rindā — dziesmas vārdi</textarea><button id="send" disabled>Rādīt dziesmu TV</button><button id="clear" disabled>Notīrīt TV tekstu</button><p id="status">Savienojas…</p><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";import{getDatabase,ref,update,get,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyA5AxDnEhA3kYFuTxscoQj0AC9lLKO-nRs",authDomain:"digitala-dziesmu-gramata.firebaseapp.com",databaseURL:"https://digitala-dziesmu-gramata-default-rtdb.europe-west1.firebasedatabase.app",projectId:"digitala-dziesmu-gramata",appId:"1:312876098365:web:1c0dba179b3996c7409b54"};const $=x=>document.getElementById(x),room=new URLSearchParams(location.search).get("room");try{if(!room)throw Error("Noskenē QR kodu, kas redzams TV ekrānā.");const app=initializeApp(firebaseConfig);await signInAnonymously(getAuth(app));const db=getDatabase(app);if(!(await get(ref(db,"rooms/"+room))).exists())throw Error("TV telpa nav atrasta. Atsvaidzini TV lapu un noskenē jauno QR kodu.");$("room").value=room;$("send").disabled=false;$("clear").disabled=false;$("status").textContent="Savienojums gatavs. Ieraksti tekstu un nospied “Rādīt dziesmu TV”.";$("send").onclick=async()=>{try{await update(ref(db,"rooms/"+room),{title:$("title").value.trim()||"Mana dziesmu grāmata",lyrics:$("lyrics").value,updatedAt:serverTimestamp()});$("status").textContent="Dziesmas teksts nosūtīts uz TV."}catch(e){$("status").textContent="Kļūda: "+e.message}};$("clear").onclick=async()=>{try{await update(ref(db,"rooms/"+room),{title:"Mana dziesmu grāmata",lyrics:"Gaidām dziesmu no telefona…",updatedAt:serverTimestamp()});$("status").textContent="TV teksts notīrīts."}catch(e){$("status").textContent="Kļūda: "+e.message}}}catch(e){$("status").textContent="Savienojuma kļūda: "+(e.message||e)}</script></body></html>
