
<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mana dziesmu grāmata</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
    iframe{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe id="book" title="Mana dziesmu grāmata"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room");
    const book = document.getElementById("book");

    if (!room) {
      document.body.innerHTML =
        "<p style='padding:20px'>Nav TV telpas koda. Lūdzu, noskenē QR kodu televizorā.</p>";
    } else {
      const url = new URL("../index.html", location.href);
      url.searchParams.set("room", room);
      url.searchParams.set("mode", "sender");
      book.src = url.href;
    }
  </script>
</body>
</html>
