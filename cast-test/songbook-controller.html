<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mana dziesmu grāmata — TV vadība</title>
<style>html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f7f7f7}iframe{display:block;width:100%;height:100%;border:0}#status{position:fixed;z-index:20;left:10px;right:10px;bottom:10px;padding:10px 12px;border-radius:10px;background:#202124;color:#fff;font-size:13px;box-shadow:0 2px 10px #0003}</style></head>
<body><iframe id="book" src="../index.html"></iframe><div id="status">Veido savienojumu ar TV…</div>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import{getDatabase,ref,get,update,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const config={apiKey:"AIzaSyA5AxDnEhA3kYFuTxscoQj0AC9lLKO-nRs",authDomain:"digitala-dziesmu-gramata.firebaseapp.com",databaseURL:"https://digitala-dziesmu-gramata-default-rtdb.europe-west1.firebasedatabase.app",projectId:"digitala-dziesmu-gramata",appId:"1:312876098365:web:1c0dba179b3996c7409b54"};
const $=id=>document.getElementById(id),room=new URLSearchParams(location.search).get("room");
async function start(){
 if(!room)throw Error("Nav atrasts TV telpas kods. Atver TV ekrānā QR kodu un noskenē to.");
 const app=getApps().find(a=>a.name==="songbook-controller")||initializeApp(config,"songbook-controller");
 await signInAnonymously(getAuth(app));const db=getDatabase(app),roomRef=ref(db,"rooms/"+room);
 if(!(await get(roomRef)).exists())throw Error("TV telpa nav aktīva. Atsvaidzini TV lapu un noskenē jauno QR kodu.");
 const frame=$("book");frame.addEventListener("load",()=>{
  const w=frame.contentWindow;w.SONGBOOK_MODE="sender";
  w.sendSongToTv=async(title,lyrics,id)=>{try{if(!String(lyrics||"").trim()){alert("Šai dziesmai vēl nav pievienots teksts.");return;}await update(roomRef,{title:String(title||"Mana dziesmu grāmata"),lyrics:String(lyrics),updatedAt:serverTimestamp()});w.SONGBOOK_TV_SHOWING=true;w.SONGBOOK_LAST_SENT_ID=String(id||"");$("status").textContent="Nosūtīts uz TV: "+String(title||"Dziesma")+". Nospied TV ikonu vēlreiz, lai noņemtu tekstu.";}catch(e){alert("TV savienojuma kļūda: "+e.message);}};
  w.clearSongFromTv=async()=>{try{await update(roomRef,{title:"Mana dziesmu grāmata",lyrics:"Gaidām dziesmu no telefona…",updatedAt:serverTimestamp()});w.SONGBOOK_TV_SHOWING=false;w.SONGBOOK_LAST_SENT_ID="";$("status").textContent="Dziesmas teksts noņemts no TV.";}catch(e){alert("Neizdevās noņemt tekstu: "+e.message);}};
  $("status").textContent="Savienojums gatavs. Atver dziesmu grāmatā dziesmu un nospied TV ikonu.";
 });
}
start().catch(e=>{$("status").textContent="TV savienojuma kļūda: "+(e.message||e);});
</script></body></html>
