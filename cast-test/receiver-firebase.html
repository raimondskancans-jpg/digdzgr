6<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mana dziesmu grāmata — TV</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;overflow:hidden}main{box-sizing:border-box;width:100%;height:100%;padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(24px,4vw,54px);font-weight:600;text-align:center;margin:0 0 4vh}#lyrics{font-size:clamp(22px,3.2vw,48px);line-height:1.45;white-space:pre-wrap;text-align:center;overflow:hidden}#setup{position:fixed;inset:0;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}#setupbox{width:min(600px,100%);font-size:16px}label{display:block;margin:12px 0 6px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{padding:12px 16px;margin-top:14px;font:inherit}#status{position:fixed;bottom:10px;left:12px;color:#777;font-size:12px}</style></head><body>
<main><h1 id="title">Mana dziesmu grāmata</h1><div id="lyrics">Gaidām dziesmu no telefona…</div></main><div id="status">Gaidām telpas kodu</div>
<div id="setup"><div id="setupbox"><h2>TV savienojums</h2><p>Ievadi to pašu Firebase konfigurāciju un telpas kodu, ko izveidoji tālruņa lapā.</p>
<label>Firebase apiKey</label><input id="apiKey"><label>Firebase authDomain</label><input id="authDomain"><label>Firebase databaseURL</label><input id="databaseURL"><label>Firebase projectId</label><input id="projectId"><label>Firebase appId</label><input id="appId"><label>TV telpas kods</label><input id="roomId" autocomplete="off"><button id="connect">Savienot ar dziesmu</button><p id="error"></p></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const $=id=>document.getElementById(id);
$("connect").onclick=async()=>{try{$("error").textContent="";const c={apiKey:$("apiKey").value.trim(),authDomain:$("authDomain").value.trim(),databaseURL:$("databaseURL").value.trim(),projectId:$("projectId").value.trim(),appId:$("appId").value.trim()},room=$("roomId").value.trim();if(Object.values(c).some(v=>!v)||!room)throw Error("Aizpildi visus konfigurācijas laukus un telpas kodu.");$("connect").disabled=true;const app=initializeApp(c);await signInAnonymously(getAuth(app));const db=getDatabase(app);onValue(ref(db,"rooms/"+room),snap=>{if(!snap.exists()){$("title").textContent="Mana dziesmu grāmata";$("lyrics").textContent="Telpa nav atrasta.";return}const d=snap.val();$("title").textContent=typeof d.title==="string"&&d.title.trim()?d.title:"Mana dziesmu grāmata";$("lyrics").textContent=typeof d.lyrics==="string"&&d.lyrics.trim()?d.lyrics:"Šai dziesmai vēl nav pievienots teksts.";$("status").textContent="Savienots • teksts atjaunojas automātiski"},err=>{$("error").textContent="Datubāzes kļūda: "+err.message;$("connect").disabled=false});$("setup").style.display="none"}catch(e){$("error").textContent="Neizdevās savienoties: "+(e.message||e);$("connect").disabled=false}};
</script></body></html>
