
<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziesmu grāmata — TV pārbaude</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
iframe{width:100%;height:100%;border:0}
#status{position:fixed;bottom:12px;left:12px;z-index:10;background:#fff;padding:10px;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<iframe id="book" src="./index.html"></iframe>
<div id="status">TV pārbaudes versija ielādējas…</div>
<script type="module">
import {initializeApp,getApps}
 from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInAnonymously}
 from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getDatabase,ref,get,update,serverTimestamp}
 from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const config={
 apiKey:"AIzaSyA5AxDnEhA3kYFuTxscoQj0AC9lLKO-nRs",
 authDomain:"digitala-dziesmu-gramata.firebaseapp.com",
 databaseURL:"https://digitala-dziesmu-gramata-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"digitala-dziesmu-gramata",
 appId:"1:312876098365:web:1c0dba179b3996c7409b54"
};
const room=new URLSearchParams(location.search).get("room");
const status=document.getElementById("status");
let roomRef,showing=false;

async function start(){
 if(!room){
  status.textContent="Vispirms TV ekrānā atver uztvērēju un noskenē QR kodu.";
  return;
 }
 const app=getApps().find(a=>a.name==="songbook-tv")
  ||initializeApp(config,"songbook-tv");
 await signInAnonymously(getAuth(app));
 const db=getDatabase(app);
 roomRef=ref(db,"rooms/"+room);
 if(!(await get(roomRef)).exists()) throw Error("TV savienojums nav aktīvs.");
 const frame=document.getElementById("book");
 frame.addEventListener("load",()=>{
  const w=frame.contentWindow;
  const old=w.triggerCast;
  w.triggerCast=async function(){
   try{
    if(showing){
     await update(roomRef,{
      title:"Mana dziesmu grāmata",
      lyrics:"Gaidām dziesmu no telefona…",
      updatedAt:serverTimestamp()
     });
     showing=false;
     status.textContent="Dziesmas teksts noņemts no TV.";
     return;
    }
    const id=w.currentSongId;
    const song=w.songsData?.[id];
    const title=w.document.getElementById("currentSongTitle")?.innerText
      ||"Dziesma";
    const lyrics=typeof song?.lyrics==="string"?song.lyrics:"";
    if(!lyrics.trim()){
     alert("Šai dziesmai vēl nav pievienots teksts.");
     return;
    }
    await update(roomRef,{
     title,lyrics,updatedAt:serverTimestamp()
    });
    showing=true;
    status.textContent="Dziesma nosūtīta uz TV. Nospied TV ikonu vēlreiz, lai noņemtu tekstu.";
   }catch(e){
    alert("TV savienojuma kļūda: "+e.message);
   }
  };
  if(old && !w.songsData){
   status.textContent="Dziesmu grāmata ielādēta; pārbaudi dziesmas atvēršanu.";
  }else{
   status.textContent="Atver dziesmu un nospied TV ikonu.";
  }
 });
}
start().catch(e=>status.textContent="TV savienojuma kļūda: "+e.message);
</script>
</body>
</html>
