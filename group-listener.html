<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mana dziesmu grāmata — dalībnieks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#292929;font-family:Arial,sans-serif}header{padding:22px 18px 16px;text-align:center;border-bottom:1px solid #eee}.note{font-size:25px;color:#8a7654;letter-spacing:5px}h1{font-size:22px;margin:8px 0 4px}main{max-width:720px;margin:0 auto;padding:20px 18px}#state{padding:12px 14px;border-radius:12px;background:#f5f2ec;color:#64543e;font-size:14px;margin-bottom:18px}#title{font-size:24px;text-align:center;margin:16px 0 20px}#lyrics{font-size:19px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;color:#888;font-size:12px;padding:24px}
</style></head><body>
<header><div class="note">♫ ♪ ♫</div><h1>Mana dziesmu grāmata</h1><div>Kopdziedāšana</div></header>
<main><div id="state">Savienojamies…</div><h2 id="title">Gaidām dziesmu…</h2><div id="lyrics">Kad vadītājs izvēlēsies dziesmu, tās vārdi parādīsies šeit.</div></main>
<footer>Dalībnieka režīms · Dziesmu izvēli vada kopdziedāšanas vadītājs</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyA5AxDnEhA3kYFuTxscoQj0AC9lLKO-nRs",authDomain:"digitala-dziesmu-gramata.firebaseapp.com",databaseURL:"https://digitala-dziesmu-gramata-default-rtdb.europe-west1.firebasedatabase.app",projectId:"digitala-dziesmu-gramata",appId:"1:312876098365:web:1c0dba179b3996c7409b54"};
const $=id=>document.getElementById(id);
try{const app=initializeApp(firebaseConfig);await signInAnonymously(getAuth(app));const db=getDatabase(app),params=new URLSearchParams(location.search);let room=params.get("room"),unsubscribe=null;
function listen(code){if(unsubscribe){unsubscribe();unsubscribe=null}if(!code){$("state").textContent="Nav atrasta kopīgās dziesmu telpas saite. Lūdzu, noskenē vadītāja QR kodu vēlreiz.";$("title").textContent="Nav kopīgās telpas";$("lyrics").textContent="";return}
$("state").textContent="Pieslēdzamies kopīgajai dziesmu telpai…";
unsubscribe=onValue(ref(db,"groupRooms/"+code),snap=>{
  const d=snap.val();
  if(!d){
    $("state").textContent="Šī telpa nav atrasta. Pārbaudi saiti vai kodu.";
    $("title").textContent="Telpa nav atrasta";
    $("lyrics").textContent="";
    return;
  }

  // onValue uzreiz atdod arī jau saglabāto telpas stāvokli,
  // ne tikai turpmākās izmaiņas. songId apliecina, ka vadītājs
  // jau ir izvēlējies dziesmu, arī tad, ja tai vēl nav vārdu.
  const hasCurrentSong=d.active!==false&&(
    (typeof d.songId==="string"&&d.songId.trim()!=="")||
    (typeof d.lyrics==="string"&&d.lyrics.trim()!==""&&d.title!=="Gaidām vadītāja izvēlēto dziesmu")
  );

  if(hasCurrentSong){
    $("state").textContent="Pašlaik tiek rādīta vadītāja izvēlētā dziesma";
    $("title").textContent=d.title||"Dziesma";
    $("lyrics").textContent=(typeof d.lyrics==="string"&&d.lyrics.trim())
      ?d.lyrics
      :"Šai dziesmai vārdi vēl nav pievienoti.";
  }else{
    $("state").textContent="Pieslēgts — gaidām vadītāja izvēlēto dziesmu";
    $("title").textContent="Gaidām dziesmu…";
    $("lyrics").textContent="Kad vadītājs izvēlēsies dziesmu, tās vārdi parādīsies šeit.";
  }
},err=>{
  $("state").textContent="Neizdevās pieslēgties: "+err.message;
  $("title").textContent="Savienojuma kļūda";
  $("lyrics").textContent="";
})}
listen(room);
}catch(e){$("state").textContent="Savienojuma kļūda: "+e.message}
</script></body></html>
